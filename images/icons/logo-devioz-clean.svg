<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 110" width="310" height="110" role="img" aria-label="Devioz">
  <defs>

    <!-- Gradiente del cuerpo D: verde muy oscuro (abajo-izq) → teal medio (arriba-der) -->
    <linearGradient id="dBody" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#07231C"/>
      <stop offset="45%"  stop-color="#0C4035"/>
      <stop offset="100%" stop-color="#1A7A62"/>
    </linearGradient>

    <!-- Cara superior del D (bevel tonal) -->
    <linearGradient id="dTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1F8A6E" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0C4035" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Diamante exterior: plata cromada -->
    <linearGradient id="diaOuter" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%"   stop-color="#EEF1F4"/>
      <stop offset="40%"  stop-color="#BDC5CC"/>
      <stop offset="100%" stop-color="#8B959D"/>
    </linearGradient>

    <!-- Diamante interior: blanco brillante -->
    <linearGradient id="diaInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="50%"  stop-color="#DDE3E8"/>
      <stop offset="100%" stop-color="#BEC7CE"/>
    </linearGradient>

  </defs>

  <!-- ═══ ÍCONO D ═══ -->

  <!-- Cuerpo principal del D — cortes angulares en esquinas izq + hueco interior -->
  <path d="
    M 27,6   L 14,16  L 14,94  L 27,104
    L 50,104
    Q 82,104 100,82
    Q 109,68  109,55
    Q 109,42  100,28
    Q 82,6   50,6
    Z

    M 32,24  L 32,86
    L 50,86
    Q 74,86  86,70
    Q 92,62  92,55
    Q 92,48  86,40
    Q 74,24  50,24
    Z"
    fill="url(#dBody)" fill-rule="evenodd"/>

  <!-- Bevel superior — cara tonal para dar profundidad -->
  <path d="
    M 50,6
    Q 82,6 100,28
    L 86,40
    Q 72,22 50,24
    L 32,24  L 27,14  L 27,6
    Z"
    fill="url(#dTop)"/>

  <!-- Resalte del spine izquierdo -->
  <rect x="14" y="16" width="6" height="78" rx="1"
        fill="#1F8A6E" opacity="0.28"/>

  <!-- ═══ DIAMANTES ═══ -->

  <!-- Diamante exterior (plata) — mismo ángulo que el original -->
  <path d="M 46,34  L 68,55  L 46,76  L 24,55  Z"
        fill="url(#diaOuter)"/>

  <!-- Diamante interior (brillo) -->
  <path d="M 46,42  L 60,55  L 46,68  L 32,55  Z"
        fill="url(#diaInner)"/>

  <!-- ═══ TEXTO EVIOZ ═══ -->
  <text x="122" y="72"
        font-family="'Segoe UI','Helvetica Neue','Helvetica','Arial',sans-serif"
        font-size="48"
        font-weight="400"
        fill="#000000"
        letter-spacing="1.5">EVIOZ</text>

</svg>
